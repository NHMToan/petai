<script>
        // Atmospheric floating effect for the PetAI companion image
        const img = document.querySelector('img[alt="PetAI Companion"]');
        let degree = 0;
        
        function animate() {
            degree += 0.02;
            const yOffset = Math.sin(degree) * 15;
            if (img) {
                img.parentElement.style.transform = `translateY(${yOffset}px)`;
            }
            requestAnimationFrame(animate);
        }
        animate();

        // Mouse move light interaction for the register card
        const card = document.querySelector('.glass-card');
        document.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);
        });
    </script>
