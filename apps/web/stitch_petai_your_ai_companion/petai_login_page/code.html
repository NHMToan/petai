<!-- Micro-interaction for Voice Wave -->
<script>
        const waves = document.querySelectorAll('.voice-wave');
        waves.forEach(wave => {
            wave.style.animationDuration = (0.8 + Math.random() * 0.8) + 's';
        });

        // Interactive focus effect on input fields
        const inputs = document.querySelectorAll('input[type="email"], input[type="password"]');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                const icon = input.parentElement.querySelector('.material-symbols-outlined');
                if(icon) {
                    icon.classList.remove('text-outline');
                    icon.classList.add('text-primary');
                }
            });
            input.addEventListener('blur', () => {
                const icon = input.parentElement.querySelector('.material-symbols-outlined');
                if(icon) {
                    icon.classList.remove('text-primary');
                    icon.classList.add('text-outline');
                }
            });
        });
    </script>
