<!-- Main Visual: Voice Waveform -->
<div class="relative w-full aspect-square flex items-center justify-center">
<!-- Pulsing Circle Backgrounds -->

<div class="absolute w-80 h-80 border border-primary/10 rounded-full"></div>

<!-- Generated Bars -->
</div>
</div>

<!-- Bottom Controls & Navigation Shell Suppression Logic Applied -->
<!-- This screen is task-focused (Voice Interaction), so global BottomNavBar is hidden for focus -->
<div class="fixed bottom-0 left-0 w-full p-container-padding flex flex-col items-center gap-6 z-50">
<!-- Interaction Status -->
<div class="px-4 py-1.5 rounded-full border border-outline-variant/30 bg-surface-container-low/50 backdrop-blur-md">
<span class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-widest">Hold to Speak</span>
</div>
<!-- Push to Talk Button -->
<button class="group relative w-20 h-20 rounded-full bg-white flex items-center justify-center transition-all duration-300 active:scale-90 hover:shadow-[0_0_40px_rgba(165,231,255,0.6)]" id="ptt-button">
<span class="material-symbols-outlined text-background text-3xl transition-transform group-hover:scale-110" style="font-variation-settings: 'FILL' 1;">mic</span>
<!-- Outer Glow Ring -->
<div class="absolute -inset-2 rounded-full border-2 border-primary/20 animate-pulse"></div>
</button>
<!-- Exit Action -->
<button class="mt-2 text-on-surface-variant/60 hover:text-on-surface transition-colors font-label-mono text-label-mono">
            TAP TO EXIT
        </button>
</div>
<!-- Voice Navigation / Settings / Back (Bottom Navigation contextually hidden as per "Task-Focused" rule) -->
<script>
        // Generate dynamic waveform bars
        const waveform = document.getElementById('waveform');
        const barCount = 32;

        for (let i = 0; i < barCount; i++) {
            const bar = document.createElement('div');
            bar.className = 'wave-bar';
            
            // Randomize animation delay and initial height for more organic feel
            const delay = Math.random() * 2;
            const duration = 0.5 + Math.random() * 1.5;
            bar.style.animationDelay = `${delay}s`;
            bar.style.animationDuration = `${duration}s`;
            bar.style.opacity = 0.3 + (Math.sin(i / barCount * Math.PI) * 0.7); // Tapered opacity
            
            waveform.appendChild(bar);
        }

        // Lightweight Micro-interaction for PTT
        const pttBtn = document.getElementById('ptt-button');
        let isHolding = false;

        pttBtn.addEventListener('mousedown', () => startSpeaking());
        pttBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startSpeaking();
        });

        window.addEventListener('mouseup', () => stopSpeaking());
        window.addEventListener('touchend', () => stopSpeaking());

        function startSpeaking() {
            isHolding = true;
            pttBtn.classList.add('scale-95', 'bg-primary');
            pttBtn.querySelector('span').classList.add('text-white');
            document.querySelectorAll('.wave-bar').forEach(bar => {
                bar.style.animationDuration = '0.4s';
                bar.style.background = '#00d2ff';
            });
        }

        function stopSpeaking() {
            if (!isHolding) return;
            isHolding = false;
            pttBtn.classList.remove('scale-95', 'bg-primary');
            pttBtn.querySelector('span').classList.remove('text-white');
            document.querySelectorAll('.wave-bar').forEach(bar => {
                bar.style.animationDuration = (0.8 + Math.random() * 1).toString() + 's';
                bar.style.background = '#a5e7ff';
            });
        }
    </script>
