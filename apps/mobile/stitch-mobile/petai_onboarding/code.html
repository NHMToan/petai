<script>
        // Micro-interaction for the button glow
        const cta = document.querySelector('button');
        cta.addEventListener('mousedown', () => {
            cta.style.transform = 'scale(0.97)';
        });
        cta.addEventListener('mouseup', () => {
            cta.style.transform = 'scale(1)';
        });

        // Simple parallax on image based on mouse/touch move
        document.addEventListener('mousemove', (e) => {
            const img = document.querySelector('img');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
            img.style.transform = `translate(${xAxis}px, ${yAxis}px)`;
        });
    </script>
