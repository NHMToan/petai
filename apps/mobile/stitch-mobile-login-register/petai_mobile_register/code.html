<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>PetAI | Create Your Neural Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "inverse-on-surface": "#313030",
                        "on-secondary-fixed-variant": "#6300bb",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "tertiary": "#dcdddf",
                        "on-secondary": "#450086",
                        "surface-container-high": "#2a2a2a",

                        "secondary-container": "#6c04ca",

                    "fontFamily": {

<style>
        body {
            background-color: #131313;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.05;
            pointer-events: none;
        }

        .atmospheric-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(71, 214, 255, 0.15) 0%, rgba(165, 231, 255, 0) 70%);
            filter: blur(60px);
            z-index: -1;
        }

        .inner-glow-border {
            box-shadow: inset 1px 1px 0px 0px rgba(255, 255, 255, 0.05);
        }

        .input-glow:focus-within {
            box-shadow: 0 0 15px rgba(71, 214, 255, 0.2);
            border-color: #47d6ff;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes pulse-heartbeat {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.9); }
        }

        .heartbeat-dot {
            animation: pulse-heartbeat 2s ease-in-out infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-on-background min-h-screen flex flex-col justify-center items-center px-container-padding relative overflow-hidden">
<!-- Atmospheric background elements -->
<div class="atmospheric-glow top-[-10%] right-[-10%]" style="background: radial-gradient(circle, rgba(165, 231, 255, 0.1) 0%, transparent 70%);"></div>
<div class="atmospheric-glow bottom-[5%] left-[-20%]" style="background: radial-gradient(circle, rgba(217, 185, 255, 0.08) 0%, transparent 70%);"></div>
<div class="w-full max-w-[440px] flex flex-col gap-stack-lg z-10 py-10">
<!-- Brand Identity -->
<div class="flex flex-col items-center gap-stack-sm mb-4">
<div class="w-16 h-16 glass-panel rounded-2xl flex items-center justify-center inner-glow-border mb-4">
<span class="material-symbols-outlined text-primary text-[40px]" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary heartbeat-dot shadow-[0_0_8px_rgba(165,231,255,0.8)]"></span>
<span class="font-label-mono text-label-mono uppercase tracking-[0.2em] text-on-surface-variant">System Initialized</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-center text-on-surface tracking-tight mt-2">Create Your Neural Profile</h1>
<p class="text-on-surface-variant text-center opacity-70">Connect your biology to the intelligence of the future.</p>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div class="flex flex-col gap-2">
<label class="font-label-mono text-label-mono text-on-surface-variant ml-1">IDENTITY NAME</label>
<div class="glass-panel rounded-xl flex items-center px-4 h-[60px] transition-all duration-300 input-glow">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="person">person</span>
<input class="bg-transparent border-none text-on-surface placeholder:text-outline-variant w-full focus:ring-0 font-body-md" placeholder="e.g. Julian Vane" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-mono text-label-mono text-on-surface-variant ml-1">NEURAL ADDRESS</label>
<div class="glass-panel rounded-xl flex items-center px-4 h-[60px] transition-all duration-300 input-glow">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="alternate_email">alternate_email</span>
<input class="bg-transparent border-none text-on-surface placeholder:text-outline-variant w-full focus:ring-0 font-body-md" placeholder="julian@pet.ai" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-mono text-label-mono text-on-surface-variant ml-1">ENCRYPTION KEY</label>
<div class="glass-panel rounded-xl flex items-center px-4 h-[60px] transition-all duration-300 input-glow">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="lock">lock</span>
<input class="bg-transparent border-none text-on-surface placeholder:text-outline-variant w-full focus:ring-0 font-body-md" placeholder="••••••••••••" type="password"/>
<span class="material-symbols-outlined text-on-surface-variant ml-3 cursor-pointer hover:text-primary transition-colors" data-icon="visibility">visibility</span>
</div>
</div>
<!-- Terms & Conditions -->
<div class="flex items-start gap-3 mt-2 px-1">
<div class="relative flex items-center">
<input class="peer h-5 w-5 rounded border-outline-variant bg-surface-container-highest text-primary focus:ring-primary/20 focus:ring-offset-0 transition-all cursor-pointer" id="terms" type="checkbox"/>
<span class="absolute material-symbols-outlined text-[14px] text-on-primary opacity-0 peer-checked:opacity-100 left-[3px] pointer-events-none" data-icon="check" style="font-variation-settings: 'wght' 700;">check</span>
</div>
<label class="text-on-surface-variant font-body-md text-sm leading-tight cursor-pointer" for="terms">
                    I acknowledge the <a class="text-primary hover:underline" href="#">Neural Protocol Terms</a> and the <a class="text-primary hover:underline" href="#">Privacy Infrastructure Agreement</a>.
                </label>
</div>
<!-- Action Button -->
<button class="mt-4 w-full h-[64px] rounded-xl bg-on-background text-surface-container-lowest font-semibold text-lg flex items-center justify-center gap-3 transition-all duration-300 active:scale-95 hover:shadow-[0_0_30px_rgba(165,231,255,0.3)] group overflow-hidden relative">
<span class="z-10">Create Account</span>
<span class="material-symbols-outlined z-10 group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
<div class="absolute inset-0 bg-primary opacity-0 group-hover:opacity-10 transition-opacity"></div>
</button>
</form>
<!-- Login Link -->
<div class="flex flex-col items-center gap-stack-sm mt-4">
<p class="text-on-surface-variant font-body-md">Already have a link?</p>
<a class="font-label-mono text-label-mono text-primary tracking-widest hover:text-primary-fixed duration-200 flex items-center gap-2 group" href="#">
                EXISTING USER LOGIN
                <span class="material-symbols-outlined text-[14px] group-hover:translate-x-1 transition-transform" data-icon="login">login</span>
</a>
</div>
</div>
<!-- Decorative Bottom Gradient -->
<div class="fixed bottom-0 left-0 w-full h-32 bg-gradient-to-t from-primary/5 to-transparent pointer-events-none"></div>
<script>
        // Micro-interaction: Mouse tracking glow effect (for desktop view compatibility)
        document.addEventListener('mousemove', (e) => {
            const glows = document.querySelectorAll('.atmospheric-glow');
            const x = (e.clientX / window.innerWidth) * 20;
            const y = (e.clientY / window.innerHeight) * 20;
            
            glows.forEach((glow, index) => {
                const multiplier = index === 0 ? 1 : -1;
                glow.style.transform = `translate(${x * multiplier}px, ${y * multiplier}px)`;
            });
        });

        // Simple input focus behavior
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('bg-white/5');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('bg-white/5');
            });
        });
    </script>
</body></html>
