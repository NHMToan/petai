<script>
        // Micro-interactions for button press and input focus
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.querySelector('label').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.querySelector('label').classList.remove('text-primary');
            });
        });

        // Toggle Password Visibility
        const toggleBtn = document.querySelector('button .material-symbols-outlined:contains("visibility")')?.parentElement;
        if (toggleBtn) {
            toggleBtn.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('.material-symbols-outlined');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility_off';
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility';
                }
            });
        }
    </script>
